<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login | The DaYiMa Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="programs-layout">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="assets/images/Logo1ldpi.png" alt="Logo" class="login-logo">
                <h2>Welcome <span class="pink-saturated">Back</span></h2>
                <p>Login to manage your workshop bookings.</p>
            </div>

            <form id="dummyLoginForm" class="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <a href="index.html" class="btn btn-saturated-pink login-btn" style="text-align: center; display: block; text-decoration: none;">
    Login
</a>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
